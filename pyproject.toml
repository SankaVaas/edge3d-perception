[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "edge3d-perception"
version = "0.1.0"
description = "CPU-first 3D scene perception pipeline with sparse-anchor depth alignment and an accuracy-latency benchmark harness."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy", "opencv-python-headless", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
